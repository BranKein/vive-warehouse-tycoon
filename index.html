<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>창고 타이쿤 · Warehouse Tycoon</title>
    <!-- Only sends visitors to /ko/ or /en/; those pages are the ones in search results. -->
    <meta name="robots" content="noindex" />
    <link rel="alternate" hreflang="ko" href="https://warehouse-tycoon.yeonhyuk.me/ko/" />
    <link rel="alternate" hreflang="en" href="https://warehouse-tycoon.yeonhyuk.me/en/" />
    <meta name="theme-color" content="#1b2430" />
    <script>
      // The language picked last (the game remembers it), else the browser's. Query and hash go along (?device=).
      (function () {
        var language = null;
        try {
          language = localStorage.getItem('warehouse-tycoon.language');
        } catch (error) {
          // Blocked storage: fall back to the browser language.
        }
        if (language !== 'ko' && language !== 'en') {
          var preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          language = /^ko\b/i.test(preferred[0] || '') ? 'ko' : 'en';
        }
        location.replace('/' + language + '/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body style="margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 24px; background: #1b2430; color: #f2ead8; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <a href="/ko/" hreflang="ko" lang="ko" style="color: inherit">창고 타이쿤 (한국어)</a>
    <a href="/en/" hreflang="en" lang="en" style="color: inherit">Warehouse Tycoon (English)</a>
  </body>
</html>
