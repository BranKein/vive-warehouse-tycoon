<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse Tycoon 모델 보기 (dev)</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; font: 13px system-ui, sans-serif; color: #4a4038; }
      body { display: grid; grid-template-columns: 230px 1fr; }
      #list { overflow-y: auto; background: #fff8ec; border-right: 1px solid #ead9c2; padding: 8px 0; }
      #list h2 { margin: 12px 14px 4px; font-size: 11px; letter-spacing: 0.06em; color: #a08c78; }
      #list button { display: block; width: 100%; padding: 5px 14px; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
      #list button:hover { background: #f6e9d6; }
      #list button[aria-current='true'] { background: #ffd9c9; font-weight: 600; }
      #list button .tag { margin-left: 6px; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; }
      #list button .tag.ok { background: #b6e2a1; }
      #list button .tag.todo { background: #ffd27d; }
      #list button .tag.bad { background: #f4a79d; }
      #list button.draft { color: #b3a595; }
      #summary { margin: 4px 14px 8px; font-size: 12px; }
      #summary label { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
      #review { position: absolute; right: 12px; top: 12px; width: 280px; padding: 10px 14px; border-radius: 14px; background: #fff8ecf2; display: grid; gap: 8px; }
      #review[hidden] { display: none; }
      #review b { font-size: 14px; }
      #review textarea { width: 100%; box-sizing: border-box; height: 64px; font: inherit; border: 1px solid #ead9c2; border-radius: 8px; padding: 6px; resize: vertical; }
      #review button { padding: 6px 10px; border: 0; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; background: #b6e2a1; }
      #review button.undo { background: #ead9c2; }
      #review .row { display: flex; gap: 8px; }
      #review ul { margin: 0; padding-left: 18px; color: #b0483c; max-height: 120px; overflow-y: auto; }
      #stage { position: relative; min-width: 0; }
      #scene { display: block; width: 100%; height: 100%; }
      #bar { position: absolute; left: 12px; top: 12px; display: flex; gap: 14px; align-items: center; padding: 6px 14px; border-radius: 999px; background: #fff8ecd9; }
      #bar label { display: flex; gap: 6px; align-items: center; }
      #to-game { padding: 4px 12px; border-radius: 999px; background: #ffd9c9; color: inherit; font-weight: 600; text-decoration: none; }
      #to-game:hover { background: #ffc4ae; }
      #swatches { position: absolute; left: 12px; right: 12px; bottom: 44px; padding: 8px 14px; border-radius: 14px; background: #fff8ecf2; display: grid; gap: 6px; }
      #swatches[hidden] { display: none; }
      #swatch-list { display: flex; flex-wrap: wrap; gap: 6px; }
      #swatch-list button { width: 26px; height: 26px; padding: 0; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #d8c6ae; cursor: pointer; }
      #swatch-list button[aria-pressed='true'] { box-shadow: 0 0 0 2px #4a4038; }
      #info { position: absolute; left: 12px; bottom: 12px; padding: 4px 12px; border-radius: 999px; background: #fff8ecd9; pointer-events: none; }
    </style>
  </head>
  <body>
    <nav id="list"></nav>
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="bar">
        <label>시각 <input id="time" type="range" min="0" max="1" step="0.005" /> <span id="time-name"></span></label>
        <label><input id="spin" type="checkbox" checked /> 회전</label>
        <label><input id="grid" type="checkbox" checked /> 눈금(1칸 = 1)</label>
        <label><input id="pad" type="checkbox" checked /> 부지</label>
        <a id="to-game" href="/">게임으로 돌아가기 →</a>
      </div>
      <div id="review" hidden>
        <b id="review-state"></b>
        <ul id="review-issues"></ul>
        <textarea id="review-note" placeholder="고칠 점을 적어 두면 Claude가 읽습니다 (자동 저장)"></textarea>
        <div class="row">
          <button id="review-approve">승인</button>
          <button id="review-next" class="undo">다음 확인 필요 →</button>
        </div>
      </div>
      <div id="swatches" hidden>
        <span>게임에 나오는 색: <b id="swatch-name"></b></span>
        <div id="swatch-list"></div>
      </div>
      <div id="info"></div>
    </div>
    <script type="module" src="./models.ts"></script>
  </body>
</html>
